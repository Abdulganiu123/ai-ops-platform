name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  CHECKOV_VERSION: "3.3.11"
  TERRAFORM_VERSION: "1.15.8"
  PYTHON_VERSION: "3.12"
  # Terraform writes downloaded providers here instead of into each
  # .terraform directory, so one cache serves every job.
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
            pip-${{ runner.os }}-

      - name: Install
        run: pip install -e . pytest

      - name: Run tests
        run: pytest tests/ -v

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-checkov-${{ env.CHECKOV_VERSION }}
          restore-keys: |
            pip-${{ runner.os }}-checkov-
            pip-${{ runner.os }}-

      - name: Prepare provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: /home/runner/.terraform.d/plugin-cache
          key: tf-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            tf-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-
            tf-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive

      # validate evaluates filebase64sha256() in lambda.tf, so the zip
      # must exist even though this job never touches AWS.
      - name: Package Lambda
        run: make package

      - name: Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Security scan
        run: |
          pip install checkov==${{ env.CHECKOV_VERSION }}
          checkov -d terraform --framework terraform

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: [test, terraform]
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
            pip-${{ runner.os }}-

      # Build before assuming the role. Packaging needs no AWS access, and
      # there is no reason to hold a session open while pip downloads.
      - name: Package Lambda
        run: make package

      - name: Prepare provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: /home/runner/.terraform.d/plugin-cache
          key: tf-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            tf-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-
            tf-${{ runner.os }}-

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Default is 12 retries, which buries the real error under a wall
          # of identical lines. Two is enough for a transient blip.
          retry-max-attempts: 2
          action-timeout-s: 60

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Plan
        working-directory: terraform
        run: |
          terraform init
          terraform plan -no-color | tee plan.txt

      # if: success() rather than always(). A cleanup step that fails because
      # an earlier step failed becomes the last and loudest line in the log,
      # burying the real cause.
      - name: Post plan to summary
        if: success()
        working-directory: terraform
        run: |
          {
            echo '## Terraform plan'
            echo '```'
            tail -50 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Bedrock smoke test
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
            pip-${{ runner.os }}-

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 2
          action-timeout-s: 60

      - name: Install
        run: pip install -e .

      - name: Generate against real Bedrock
        run: devgen dockerfile --lang python
