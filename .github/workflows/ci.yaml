name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  CHECKOV_VERSION: "3.3.11"
  TERRAFORM_VERSION: "1.15.8"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e . pytest

      - name: Run tests
        run: pytest tests/ -v

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache checkov
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: checkov-${{ env.CHECKOV_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive
      
      - name: Package Lambda
        run: make package

      - name: Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Security scan
        run: |
          pip install checkov==${{ env.CHECKOV_VERSION }}
          checkov -d terraform --framework terraform

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: [test, terraform]
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Package Lambda
        run: make package

      - name: Plan
        working-directory: terraform
        run: |
          terraform init
          terraform plan -no-color | tee plan.txt

      - name: Post plan to summary
        if: always()
        working-directory: terraform
        run: |
          echo '## Terraform plan' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  smoke:
    name: Bedrock smoke test
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install
        run: pip install -e .

      - name: Generate against real Bedrock
        run: devgen dockerfile --lang python