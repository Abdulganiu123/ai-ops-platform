name: CI

on:
  push:
    branches: [main]
  pull_request:

# OIDC needs id-token. Everything else stays read-only.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e . pytest

      - name: Run tests
        run: pytest tests/ -v

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: [test, terraform]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Plan
        working-directory: terraform
        run: |
          terraform init
          terraform plan -var="budget_alert_email=${{ secrets.BUDGET_ALERT_EMAIL }}"

  smoke:
    name: Bedrock smoke test
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install
        run: pip install -e .

      - name: Generate against real Bedrock
        run: devgen dockerfile --lang python